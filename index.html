<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Noviembre - Control de Asistencia</title>
    <style>
        :root {
            --bg-main: #0a0512;
            --bg-card: #140b24;
            --neon-magenta: #ff007f;
            --neon-glow: 0 0 10px #ff007f, 0 0 20px #ff007f;
            --neon-fuchsia: #d4007a;
            --text-white: #ffffff;
            --text-pink: #fbcfe8;
            --color-green: #39ff14;
            --color-yellow: #ffee00;
            --color-red: #ff3131;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            position: relative;
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--neon-magenta);
            padding-bottom: 15px;
            box-shadow: 0 4px 20px -10px var(--neon-magenta);
        }

        h1 {
            color: var(--text-white);
            text-shadow: var(--neon-glow);
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .date-label {
            color: var(--text-pink);
            font-size: 0.95rem;
        }

        .date-picker {
            background: #25123e;
            color: var(--text-white);
            border: 1px solid var(--neon-magenta);
            padding: 5px 10px;
            border-radius: 5px;
            outline: none;
            font-size: 0.95rem;
            cursor: pointer;
        }

        /* Indicador de estado súper discreto en la esquina superior derecha */
        .status-badge {
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 0.75rem;
            color: #775588;
            background: rgba(37, 18, 62, 0.4);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 0, 127, 0.2);
            transition: all 0.3s ease;
        }

        .status-badge.connected {
            color: var(--color-green);
            border-color: var(--color-green);
        }

        .status-badge.error {
            color: var(--color-red);
            border-color: var(--color-red);
        }

        /* Panel KPIs */
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--neon-magenta);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(255, 0, 127, 0.1);
        }

        .kpi-title {
            font-size: 0.85rem;
            color: var(--text-pink);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .kpi-value {
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        /* Contenedor Principal de Datos */
        .view-container {
            width: 100%;
            overflow-x: auto;
        }

        /* Controles Comunes Interfaz */
        select, button {
            background: #25123e;
            color: var(--text-white);
            border: 1px solid var(--neon-magenta);
            padding: 8px 12px;
            border-radius: 5px;
            outline: none;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:focus {
            box-shadow: 0 0 8px var(--neon-magenta);
        }

        button {
            background: var(--neon-fuchsia);
            font-weight: bold;
            text-transform: uppercase;
        }

        button:hover:not(:disabled) {
            box-shadow: var(--neon-glow);
            background: var(--neon-magenta);
        }

        button:disabled {
            background: #331c44;
            border-color: #553366;
            color: #775588;
            cursor: not-allowed;
        }

        .btn-lunch { background: #0077ff; border-color: #00a2ff; }
        .btn-lunch:hover:not(:disabled) { box-shadow: 0 0 10px #00a2ff; background: #00a2ff; }

        /* Estilos Tabla (Computadora) */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }

        th {
            background: #1f0f33;
            color: var(--text-pink);
            border-bottom: 2px solid var(--neon-magenta);
            padding: 15px;
            text-align: left;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #2d1947;
            vertical-align: middle;
        }

        tr.row-absent {
            background: rgba(255, 49, 49, 0.15) !important;
        }

        .row-absent select, .row-absent button {
            opacity: 0.4;
            pointer-events: none;
        }

        /* Estilos Tarjetas (Celular) */
        .cards-container {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .mobile-card {
            background: var(--bg-card);
            border: 1px solid var(--neon-magenta);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .mobile-card.card-absent {
            background: rgba(255, 49, 49, 0.15);
            border-color: var(--color-red);
        }

        .card-header-name {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #2d1947;
            padding-bottom: 8px;
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }

        .card-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }

        .card-field label {
            font-size: 0.8rem;
            color: var(--text-pink);
            text-transform: uppercase;
        }

        .card-field select, .card-field button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
        }

        /* Alertas de Almuerzo */
        .lunch-alert-warning {
            color: var(--color-yellow) !important;
            font-weight: bold;
        }

        .lunch-alert-danger {
            color: var(--color-red) !important;
            font-weight: bold;
            animation: pulse-red 1s infinite alternate;
        }

        @keyframes pulse-red {
            from { text-shadow: 0 0 2px var(--color-red); }
            to { text-shadow: 0 0 12px var(--color-red), 0 0 20px var(--color-red); }
        }

        /* Medias Queries de Responsividad */
        @media (min-width: 769px) {
            table { display: table; }
            .cards-container { display: none; }
        }

        @media (max-width: 768px) {
            table { display: none; }
            .cards-container { display: flex; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cyber Noviembre</h1>
        <div class="header-controls">
            <span class="date-label">Operación del Día:</span>
            <input type="date" id="datePicker" class="date-picker">
        </div>
        <div id="statusBadge" class="status-badge">Conectando...</div>
    </header>

    <!-- Panel KPIs -->
    <div class="kpi-container">
        <div class="kpi-card">
            <div class="kpi-title">Programados hoy</div>
            <div class="kpi-value" id="kpiProgramados" style="color: var(--text-white);">0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Activos en Piso</div>
            <div class="kpi-value" id="kpiActivos" style="color: var(--color-green);">0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">En Almuerzo</div>
            <div class="kpi-value" id="kpiAlmuerzo" style="color: var(--color-yellow);">0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Por Llegar</div>
            <div class="kpi-value" id="kpiPorLlegar" style="color: var(--text-pink);">0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Ausencias</div>
            <div class="kpi-value" id="kpiAusencias" style="color: var(--color-red);">0</div>
        </div>
    </div>
    
    <div class="view-container">
        <!-- Escritorio -->
        <table id="desktopTable">
            <thead>
                <tr>
                    <th>Trabajador</th>
                    <th>Asistencia</th>
                    <th>Función</th>
                    <th>Subfunción</th>
                    <th>Entrada</th>
                    <th>Almuerzo (60 min)</th>
                    <th>Salida</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <!-- Móvil -->
        <div id="cardsContainer" class="cards-container"></div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRNswXWAEChDyYVKtQitY40qXCUZ8kNsn8eD2jP-LroAuQGlfg9GpACSrAMLDlM1mlhOowgUsbm3PBp/pub?gid=0&single=true&output=csv';

        let csvLines = [];
        let staffData = [];
        let localStates = JSON.parse(localStorage.getItem('cyber_neon_attendance_v2')) || {};

        // Iniciar con la fecha del sistema en formato YYYY-MM-DD para el input date
        const dateInput = document.getElementById('datePicker');
        const systemToday = new Date();
        const yyyy = systemToday.getFullYear();
        const mm = String(systemToday.getMonth() + 1).padStart(2, '0');
        const dd = String(systemToday.getDate()).padStart(2, '0');
        dateInput.value = `${yyyy}-${mm}-${dd}`;

        // Convertir formato YYYY-MM-DD a DD/MM/AAAA para cruzar con la cabecera CSV
        function getFormattedDate(dateStr) {
            const parts = dateStr.split('-');
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        function setStatus(text, type) {
            const badge = document.getElementById('statusBadge');
            badge.innerText = text;
            badge.className = 'status-badge';
            if (type === 'success') badge.classList.add('connected');
            if (type === 'error') badge.classList.add('error');
        }

        async function fetchSheetData() {
            try {
                setStatus('Conectando...', 'loading');
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error();
                const text = await response.text();
                csvLines = text.split(/\r?\n/);
                setStatus('Conectado ✔', 'success');
                processSelectedDate();
            } catch (error) {
                setStatus('Error de conexión', 'error');
            }
        }

        function processSelectedDate() {
            if (csvLines.length < 2) return;

            const selectedDate = getFormattedDate(dateInput.value);
            const headerDates = csvLines[1].split(',');
            
            let dateColumnIndex = -1;
            for (let i = 0; i < headerDates.length; i++) {
                if (headerDates[i].trim() === selectedDate) {
                    dateColumnIndex = i;
                    break;
                }
            }

            if (dateColumnIndex === -1) {
                setStatus('Sin horario hoy', 'error');
                staffData = [];
                renderApp();
                return;
            } else {
                setStatus('Conectado ✔', 'success');
            }

            staffData = [];
            for (let i = 2; i < csvLines.length; i++) {
                if (!csvLines[i].trim()) continue;
                
                const columns = csvLines[i].split(',');
                if (columns.length <= dateColumnIndex) continue;

                const trabajador = columns[0]?.trim();
                const area = columns[1]?.trim();
                const horarioHoy = columns[dateColumnIndex]?.trim();

                // Exclusión si es Libre o LIC
                if (!trabajador || horarioHoy === "Libre" || horarioHoy === "LIC") {
                    continue; 
                }

                staffData.push({
                    id: `emp_${i}_${trabajador.replace(/\s+/g, '_')}`,
                    nombre: trabajador,
                    area: area,
                    horario: horarioHoy
                });
            }

            renderApp();
        }

        function getSubfunctionOptions(func) {
            if (func === 'PICKER') return ['Piso 1', 'Piso 2', 'Piso 3', 'Piso 4'];
            if (func === 'EVENTO') return ['Empaque', 'Desempiochado', 'Etiquetado', 'Impresión'];
            if (func === 'RET') return ['Runner', 'Front'];
            return ['No aplica'];
        }

        function getRecordState(id, area) {
            const dateKey = dateInput.value; // Clave por fecha para separar estados de días distintos
            if (!localStates[dateKey]) localStates[dateKey] = {};
            
            if (!localStates[dateKey][id]) {
                localStates[dateKey][id] = {
                    asistencia: 'Espera',
                    funcion: area === 'Evento' ? 'EVENTO' : 'PICKER',
                    subfuncion: '',
                    horaEntrada: '',
                    horaSalida: '',
                    lunchStatus: 'ready',
                    lunchStart: null,
                    lunchElapsed: 0
                };
                localStates[dateKey][id].subfuncion = getSubfunctionOptions(localStates[dateKey][id].funcion)[0];
                saveToLocalStorage();
            }
            return localStates[dateKey][id];
        }

        function saveToLocalStorage() {
            localStorage.setItem('cyber_neon_attendance_v2', JSON.stringify(localStates));
        }

        function renderApp() {
            const tableBody = document.getElementById('tableBody');
            const cardsContainer = document.getElementById('cardsContainer');
            
            tableBody.innerHTML = '';
            cardsContainer.innerHTML = '';

            const dateKey = dateInput.value;

            staffData.forEach(person => {
                const state = getRecordState(person.id, person.area);
                
                // --- TABLE ---
                const tr = document.createElement('tr');
                if (state.asistencia === 'Faltó') tr.className = 'row-absent';

                tr.innerHTML = `
                    <td style="font-weight: bold;">${person.nombre}</td>
                    <td>
                        <select onchange="updateAsistencia('${person.id}', this.value)">
                            <option value="Espera" ${state.asistencia === 'Espera' ? 'selected' : ''}>Espera</option>
                            <option value="Presente" ${state.asistencia === 'Presente' ? 'selected' : ''}>Presente</option>
                            <option value="Faltó" ${state.asistencia === 'Faltó' ? 'selected' : ''}>Faltó</option>
                        </select>
                    </td>
                    <td>
                        <select onchange="updateFuncion('${person.id}', this.value)">
                            <option value="PICKER" ${state.funcion === 'PICKER' ? 'selected' : ''}>PICKER</option>
                            <option value="EVENTO" ${state.funcion === 'EVENTO' ? 'selected' : ''}>EVENTO</option>
                            <option value="RET" ${state.funcion === 'RET' ? 'selected' : ''}>RET</option>
                            <option value="EMPAQUE" ${state.funcion === 'EMPAQUE' ? 'selected' : ''}>EMPAQUE</option>
                            <option value="ESCANEO" ${state.funcion === 'ESCANEO' ? 'selected' : ''}>ESCANEO</option>
                            <option value="LIDER" ${state.funcion === 'LIDER' ? 'selected' : ''}>LIDER</option>
                            <option value="PERFUMERIA" ${state.funcion === 'PERFUMERIA' ? 'selected' : ''}>PERFUMERIA</option>
                        </select>
                    </td>
                    <td>
                        <select id="sub_table_${person.id}" onchange="updateSubfuncion('${person.id}', this.value)">
                            ${getSubfunctionOptions(state.funcion).map(opt => `<option value="${opt}" ${state.subfuncion === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                        </select>
                    </td>
                    <td>
                        <button ${state.asistencia !== 'Presente' || state.horaEntrada ? 'disabled' : ''} onclick="registrarEntrada('${person.id}')">
                            ${state.horaEntrada ? state.horaEntrada : 'Marcar'}
                        </button>
                    </td>
                    <td>
                        <button class="btn-lunch" id="lunch_table_${person.id}" ${state.asistencia !== 'Presente' || !state.horaEntrada || state.horaSalida ? 'disabled' : ''} onclick="controlAlmuerzo('${person.id}')">
                            ${getLunchButtonText(state)}
                        </button>
                        <span id="timer_table_${person.id}" style="margin-left: 8px; font-family: monospace;"></span>
                    </td>
                    <td>
                        <button ${state.asistencia !== 'Presente' || !state.horaEntrada || state.horaSalida ? 'disabled' : ''} onclick="registrarSalida('${person.id}')">
                            ${state.horaSalida ? state.horaSalida : 'Marcar'}
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);

                // --- CARDS ---
                const card = document.createElement('div');
                card.className = `mobile-card ${state.asistencia === 'Faltó' ? 'card-absent' : ''}`;
                
                card.innerHTML = `
                    <div class="card-header-name">${person.nombre}</div>
                    
                    <div class="card-field">
                        <label>Asistencia</label>
                        <select onchange="updateAsistencia('${person.id}', this.value)">
                            <option value="Espera" ${state.asistencia === 'Espera' ? 'selected' : ''}>Espera</option>
                            <option value="Presente" ${state.asistencia === 'Presente' ? 'selected' : ''}>Presente</option>
                            <option value="Faltó" ${state.asistencia === 'Faltó' ? 'selected' : ''}>Faltó</option>
                        </select>
                    </div>

                    <div style="${state.asistencia === 'Faltó' ? 'opacity:0.4; pointer-events:none;' : ''}">
                        <div class="card-field">
                            <label>Función</label>
                            <select onchange="updateFuncion('${person.id}', this.value)">
                                <option value="PICKER" ${state.funcion === 'PICKER' ? 'selected' : ''}>PICKER</option>
                                <option value="EVENTO" ${state.funcion === 'EVENTO' ? 'selected' : ''}>EVENTO</option>
                                <option value="RET" ${state.funcion === 'RET' ? 'selected' : ''}>RET</option>
                                <option value="EMPAQUE" ${state.funcion === 'EMPAQUE' ? 'selected' : ''}>EMPAQUE</option>
                                <option value="ESCANEO" ${state.funcion === 'ESCANEO' ? 'selected' : ''}>ESCANEO</option>
                                <option value="LIDER" ${state.funcion === 'LIDER' ? 'selected' : ''}>LIDER</option>
                                <option value="PERFUMERIA" ${state.funcion === 'PERFUMERIA' ? 'selected' : ''}>PERFUMERIA</option>
                            </select>
                        </div>

                        <div class="card-field">
                            <label>Subfunción</label>
                            <select id="sub_card_${person.id}" onchange="updateSubfuncion('${person.id}', this.value)">
                                ${getSubfunctionOptions(state.funcion).map(opt => `<option value="${opt}" ${state.subfuncion === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                            </select>
                        </div>

                        <div class="card-field">
                            <label>Entrada Real</label>
                            <button ${state.asistencia !== 'Presente' || state.horaEntrada ? 'disabled' : ''} onclick="registrarEntrada('${person.id}')">
                                ${state.horaEntrada ? `Entrada: ${state.horaEntrada}` : 'Registrar Entrada'}
                            </button>
                        </div>

                        <div class="card-field">
                            <label>Break Almuerzo</label>
                            <button class="btn-lunch" id="lunch_card_${person.id}" ${state.asistencia !== 'Presente' || !state.horaEntrada || state.horaSalida ? 'disabled' : ''} onclick="controlAlmuerzo('${person.id}')">
                                ${getLunchButtonText(state)}
                            </button>
                            <div style="text-align: center; margin-top: 5px; font-family: monospace;" id="timer_card_${person.id}"></div>
                        </div>

                        <div class="card-field">
                            <label>Salida Final</label>
                            <button ${state.asistencia !== 'Presente' || !state.horaEntrada || state.horaSalida ? 'disabled' : ''} onclick="registrarSalida('${person.id}')">
                                ${state.horaSalida ? `Salida: ${state.horaSalida}` : 'Registrar Salida'}
                            </button>
                        </div>
                    </div>
                `;
                cardsContainer.appendChild(card);
            });

            calculateKPIs();
        }

        function getLunchButtonText(state) {
            if (state.lunchStatus === 'ready') return 'Salir Almuerzo';
            if (state.lunchStatus === 'eating') return 'Volver Almuerzo';
            return `Terminado (${state.lunchElapsed} min)`;
        }

        function updateAsistencia(id, value) {
            const dateKey = dateInput.value;
            localStates[dateKey][id].asistencia = value;
            if (value !== 'Presente') {
                localStates[dateKey][id].horaEntrada = '';
                localStates[dateKey][id].horaSalida = '';
                localStates[dateKey][id].lunchStatus = 'ready';
                localStates[dateKey][id].lunchStart = null;
                localStates[dateKey][id].lunchElapsed = 0;
            }
            saveToLocalStorage();
            renderApp();
        }

        function updateFuncion(id, value) {
            const dateKey = dateInput.value;
            localStates[dateKey][id].funcion = value;
            const subOpts = getSubfunctionOptions(value);
            localStates[dateKey][id].subfuncion = subOpts[0];
            saveToLocalStorage();
            renderApp();
        }

        function updateSubfuncion(id, value) {
            const dateKey = dateInput.value;
            localStates[dateKey][id].subfuncion = value;
            saveToLocalStorage();
        }

        function registrarEntrada(id) {
            const dateKey = dateInput.value;
            const now = new Date();
            localStates[dateKey][id].horaEntrada = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            saveToLocalStorage();
            renderApp();
        }

        function registrarSalida(id) {
            const dateKey = dateInput.value;
            const now = new Date();
            localStates[dateKey][id].horaSalida = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            saveToLocalStorage();
            renderApp();
        }

        function controlAlmuerzo(id) {
            const dateKey = dateInput.value;
            const state = localStates[dateKey][id];
            if (state.lunchStatus === 'ready') {
                state.lunchStatus = 'eating';
                state.lunchStart = Date.now();
            } else if (state.lunchStatus === 'eating') {
                state.lunchStatus = 'done';
                state.lunchElapsed = Math.floor((Date.now() - state.lunchStart) / 60000);
                state.lunchStart = null;
            }
            saveToLocalStorage();
            renderApp();
        }

        function calculateKPIs() {
            let programados = staffData.length;
            let activos = 0;
            let enAlmuerzo = 0;
            let porLlegar = 0;
            let ausencias = 0;

            const dateKey = dateInput.value;

            staffData.forEach(p => {
                const state = localStates[dateKey]?.[p.id];
                if (!state) return;

                if (state.asistencia === 'Espera') {
                    porLlegar++;
                } else if (state.asistencia === 'Faltó') {
                    ausencias++;
                } else if (state.asistencia === 'Presente') {
                    if (!state.horaEntrada) {
                        porLlegar++;
                    } else if (state.lunchStatus === 'eating') {
                        enAlmuerzo++;
                    } else if (state.horaSalida) {
                        // Inactivo
                    } else {
                        activos++;
                    }
                }
            });

            document.getElementById('kpiProgramados').innerText = programados;
            document.getElementById('kpiActivos').innerText = activos;
            document.getElementById('kpiAlmuerzo').innerText = enAlmuerzo;
            document.getElementById('kpiPorLlegar').innerText = porLlegar;
            document.getElementById('kpiAusencias').innerText = ausencias;
        }

        // Relojes de Almuerzo en tiempo real
        setInterval(() => {
            const dateKey = dateInput.value;
            if (!localStates[dateKey]) return;

            staffData.forEach(p => {
                const state = localStates[dateKey][p.id];
                if (state && state.lunchStatus === 'eating' && state.lunchStart) {
                    const totalSegundos = Math.floor((Date.now() - state.lunchStart) / 1000);
                    const minutos = Math.floor(totalSegundos / 60);
                    const segundos = totalSegundos % 60;
                    const displayTime = `${String(minutos).padStart(2, '0')}:${String(segundos).padStart(2, '0')} min`;

                    const tTab = document.getElementById(`timer_table_${p.id}`);
                    const tCrd = document.getElementById(`timer_card_${p.id}`);

                    [tTab, tCrd].forEach(el => {
                        if (el) {
                            el.innerText = displayTime;
                            el.className = '';
                            if (minutos >= 65) {
                                el.classList.add('lunch-alert-danger');
                            } else if (minutos >= 60) {
                                el.classList.add('lunch-alert-warning');
                            }
                        }
                    });
                }
            });
        }, 1000);

        dateInput.addEventListener('change', processSelectedDate);
        fetchSheetData();
    </script>
</body>
</html>
