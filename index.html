<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia Cyber</title>
    <style>
        :root {
            --bg: #0d0614;
            --panel: #160d24;
            --pink: #ff007f;
            --purple: #9d00ff;
            --text: #ffffff;
            --muted: #ffb3d9;
            --border: #3d1b5c;
            --red: #ff3333;
            --green: #00ff66;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; }
        header { text-align: center; margin-bottom: 20px; border-bottom: 2px dashed var(--pink); padding-bottom: 10px; }
        header h1 { font-size: 1.6rem; color: #fff; text-shadow: 0 0 10px var(--pink); }
        .controls { background: var(--panel); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        label { color: var(--muted); font-weight: bold; font-size: 0.9rem; }
        select, input { background: #25163a; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 5px; width: 100%; font-size: 1rem; outline: none; }
        select:focus, input:focus { border-color: var(--pink); }
        .cards-container { display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
        .card.missing { border-color: var(--red); background: rgba(255, 51, 51, 0.05); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
        .name { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .status-select { width: auto; padding: 5px; }
        .badge { font-size: 0.85rem; color: #00ffff; background: rgba(0, 255, 255, 0.1); padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stamps { background: #1f1233; padding: 12px; border-radius: 6px; border: 1px solid #2d184c; display: flex; flex-direction: column; gap: 10px; }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .btn { background: linear-gradient(45deg, var(--purple), var(--pink)); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; flex: 1; font-size: 0.85rem; }
        .btn-lunch { background: #e67e22; }
        .btn:disabled { background: #333 !important; color: #777 !important; cursor: not-allowed; }
        .time { font-family: monospace; font-size: 0.95rem; min-width: 75px; text-align: right; }
        @media (min-width: 768px) {
            .controls { flex-direction: row; justify-content: space-between; align-items: center; }
            .controls > div { display: flex; align-items: center; gap: 10px; width: auto; }
            select, input { width: 220px; }
            .cards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
        }
    </style>
</head>
<body>
    <header><h1>CONTROL DE ASISTENCIA</h1></header>
    <div class="controls">
        <div><label>Área:</label><select id="area-filter"><option value="ALL">-- Ver Todos --</option></select></div>
        <div><label>Fecha:</label><input type="date" id="date-filter"></div>
    </div>
    <div class="cards-container" id="container"></div>
    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNswXWAEChDyYVKtQitY40qXCUZ8kNsn8eD2jP-LroAuQGlfg9GpACSrAMLDlM1mlhOowgUsbm3PBp/pub?gid=0&single=true&output=csv";
        const subMap = { "PICKER": ["Piso 1", "Piso 2", "Piso 3", "Piso 4"], "EVENTO": ["Empaque", "Desempiochado", "Etiquetado", "Impresion"], "RET": ["Runner", "Front"] };
        let workers = [];
        const dInput = document.getElementById('date-filter');
        
        const h = new Date();
        dInput.value = new Date(h.getTime() - (h.getTimezoneOffset()*60000)).toISOString().split('T')[0];

        async function start() {
            try {
                const res = await fetch(csvUrl);
                const txt = await res.text();
                const lines = txt.split('\n').map(l => l.split(',').map(c => c.replace(/^"|"$/g, '').trim()));
                if(lines.length < 3) return;
                const dates = lines[1];
                for(let i=2; i<lines.length; i++) {
                    const r = lines[i];
                    if(!r || r.length < 2) continue;
                    const sched = {};
                    for(let j=2; j<r.length; j++) if(dates[j]) sched[dates[j]] = r[j] || "Libre";
                    workers.push({ name: r[0], area: r[1], sched });
                }
                const areas = [...new Set(workers.map(w => w.area))].filter(Boolean);
                areas.forEach(a => { const o = document.createElement('option'); o.value = a; o.textContent = a; document.getElementById('area-filter').appendChild(o); });
                render();
                dInput.addEventListener('change', render);
                document.getElementById('area-filter').addEventListener('change', render);
            } catch(e) { console.error(e); }
        }

        function render() {
            const cont = document.getElementById('container');
            cont.innerHTML = '';
            const selArea = document.getElementById('area-filter').value;
            const selDate = dInput.value.split('-');
            const dateKey = `${selDate[2]}/${selDate[1]}/${selDate[0]}`;

            workers.forEach(w => {
                if(selArea !== 'ALL' && w.area !== selArea) return;
                const id = btoa(unescape(encodeURIComponent(w.name))).replace(/[^A-Za-z0-9]/g, '');
                const prog = w.sched[dateKey] || "Libre";
                
                const k = (f) => `att_${dInput.value}_${id}_${f}`;
                const est = localStorage.getItem(k('est')) || 'Presente';
                const fn = localStorage.getItem(k('fn')) || '';
                const sub = localStorage.getItem(k('sub')) || '';
                const ent = localStorage.getItem(k('ent')) || '--:--';
                const sal = localStorage.getItem(k('sal')) || '--:--';
                const lOut = localStorage.getItem(k('lOut')) || '';
                const lIn = localStorage.getItem(k('lIn')) || '';

                const card = document.createElement('div');
                card.className = `card ${est === 'Faltó' ? 'missing' : ''}`;
                
                let sOpts = '<option value="">-- No Aplica --</option>';
                if(subMap[fn]) subMap[fn].forEach(s => sOpts += `<option value="${s}" ${sub === s ? 'selected' : ''}>${s}</option>`);

                let lTxt = "Salir Almuerzo", lTime = "--:--";
                if(lOut && !lIn) lTxt = "Volver Almuerzo";
                else if(lOut && lIn) { lTxt = "Almuerzo Listo"; lTime = `${Math.round((new Date(lIn)-new Date(lOut))/60000)} min`; }

                card.innerHTML = `
                    <div class="card-header"><div class="name">${w.name}</div>
                    <select class="status-select" onchange="localStorage.setItem('${k('est')}', this.value); render();">
                        <option value="Presente" ${est==='Presente'?'selected':''}>Presente</option>
                        <option value="Faltó" ${est==='Faltó'?'selected':''}>Faltó</option>
                        <option value="Tardanza" ${est==='Tardanza'?'selected':''}>Tardanza</option>
                        <option value="Descanso" ${est==='Descanso'?'selected':''}>Descanso</option>
                        <option value="Licencia" ${est==='Licencia'?'selected':''}>Licencia</option>
                    </select></div>
                    <div><span class="badge">Prog: ${prog}</span></div>
                    <div class="grid">
                        <div><label>Función</label><select ${est==='Faltó'?'disabled':''} onchange="localStorage.setItem('${k('fn')}', this.value); localStorage.setItem('${k('sub')}', ''); render();">
                            <option value="">Seleccione...</option><option value="PICKER" ${fn==='PICKER'?'selected':''}>PICKER</option><option value="EVENTO" ${fn==='EVENTO'?'selected':''}>EVENTO</option><option value="RET" ${fn==='RET'?'selected':''}>RET</option>
                            <option value="EMPAQUE" ${fn==='EMPAQUE'?'selected':''}>EMPAQUE</option><option value="ESCANEO" ${fn==='ESCANEO'?'selected':''}>ESCANEO</option><option value="LIDER" ${fn==='LIDER'?'selected':''}>LIDER</option><option value="PERFUMERIA" ${fn==='PERFUMERIA'?'selected':''}>PERFUMERIA</option>
                        </select></div>
                        <div><label>Subfunción</label><select ${est==='Faltó'||!subMap[fn]?'disabled':''} onchange="localStorage.setItem('${k('sub')}', this.value);">${sOpts}</select></div>
                    </div>
                    <div class="stamps">
                        <div class="row"><button class="btn" ${est==='Faltó'?'disabled':''} onclick="stamp('${id}','ent')">🕒 Entrada</button><div class="time">${ent}</div></div>
                        <div class="row"><button class="btn btn-lunch" ${est==='Faltó'||lTxt==='Almuerzo Listo'?'disabled':''} onclick="lunch('${id}','${lTxt}')">🍔 ${lTxt}</button><div class="time">${lTime}</div></div>
                        <div class="row"><button class="btn" ${est==='Faltó'?'disabled':''} onclick="stamp('${id}','sal')">🕒 Salida</button><div class="time">${sal}</div></div>
                    </div>
                `;
                cont.appendChild(card);
            });
        }

        window.stamp = function(id, f) {
            const t = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false});
            localStorage.setItem(`att_${dInput.value}_${id}_${f}`, t);
            render();
        }

        window.lunch = function(id, txt) {
            const iso = new Date().toISOString();
            localStorage.setItem(`att_${dInput.value}_${id}_${txt==='Salir Almuerzo'?'lOut':'lIn'}`, iso);
            render();
        }

        start();
    </script>
</body>
</html>
